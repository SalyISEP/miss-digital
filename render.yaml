databases:
  - name: miss-digital-db
    plan: free
    databaseName: missdigital
    user: missdigital

services:
  - type: web
    name: miss-digital
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: python -m gunicorn config.wsgi:application

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: miss-digital-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: PYTHON_VERSION
        value: "3.13.0"

      - key: WEB_CONCURRENCY
        value: "2"

      - key: EMAIL_HOST
        value: "smtp-relay.brevo.com"

      - key: EMAIL_PORT
        value: "587"

      - key: EMAIL_USE_TLS
        value: "True"

      - key: EMAIL_HOST_USER
        sync: false

      - key: EMAIL_HOST_PASSWORD
        sync: false

      - key: DEFAULT_FROM_EMAIL
        value: "Miss Digital Tech <contact.missdigital@gmail.com>"

      - key: MDT_NOTIFICATION_EMAIL
        value: "contact.missdigital@gmail.com"
